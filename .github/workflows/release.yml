name: Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version tag, or commit for a dry run
        type: string
        required: true
      publish:
        description: Publish the verified release
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      actions: read
    uses: computer-mcp/github-workflows/.github/workflows/plugin-release.yml@36a8e11e46fc8831397cebab54cd4657dcac7898
    with:
      ref: ${{ inputs.ref }}
      publish: ${{ inputs.publish }}
      build: scripts/build-package.sh
      ci_artifact: computer-use-plugin-${commit}
  notify-catalog:
    needs: release
    if: inputs.publish && needs.release.outputs.published == 'true'
    permissions: {}
    uses: ./.github/workflows/notify-catalog.yml
    secrets:
      CATALOG_APP_PRIVATE_KEY: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
